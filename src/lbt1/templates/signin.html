<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Locksmith Daddy</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root { --bg: #0f1419; --panel: #1a2027; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --accent: #ff6b35; --red: #f85149; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; line-height: 1.5; }
    .auth-wrap { max-width: 420px; margin: 60px auto; }
    h1 { font-size: 26px; margin: 0 0 4px 0; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; margin-top: 14px; }
    label:first-of-type { margin-top: 0; }
    input[type=email], input[type=password], input[type=text], input[type=tel] {
      width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 15px; font-family: inherit;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button.primary { width: 100%; margin-top: 18px; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .meta { margin-top: 16px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
    .meta a { color: var(--accent); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .error { background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.3); color: var(--red); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <h1>Locksmith Daddy</h1>
    <div class="subtitle">Sign in to access Tool 1 — VIN Key Finder.</div>

    {{ error_html }}

    <div class="card">
      <form method="post" action="/signin">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="primary">Sign in</button>
      </form>

      <div class="meta">
        <a href="/signup">Create account</a>
        <a href="/forgot">Forgot password?</a>
      </div>
    </div>

    <div class="footer">For certified locksmiths only.</div>
  </div>

  <script>
    // Render server-provided error (URL-encoded query param) safely.
    (function() {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      if (err) {
        const div = document.createElement('div');
        div.className = 'error';
        div.textContent = err;
        document.querySelector('.subtitle').after(div);
      }
    })();
  </script>
</body>
</html>
