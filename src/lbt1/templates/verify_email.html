<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify email · Locksmith Daddy</title>
  <style>
    :root { --bg: #0f1419; --panel: #1a2027; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --accent: #ff6b35; --green: #3fb950; --red: #f85149; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; line-height: 1.5; }
    .wrap { max-width: 480px; margin: 60px auto; }
    h1 { font-size: 24px; margin: 0 0 6px 0; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .email { font-family: "SF Mono", Consolas, monospace; color: var(--accent); }
    button { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .msg.error { background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); color: var(--red); }
    .msg.success { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); color: var(--green); }
    a { color: var(--accent); }
    .small { font-size: 12px; color: var(--muted); margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Check your email</h1>
    <div class="subtitle">We sent a verification link to <span class="email">{{ email }}</span>.</div>
    {{ msg_html }}
    <div class="card">
      <p>Click the link in the email to verify your address and start your free trial.</p>
      <form method="post" action="/verify-email/resend" style="margin-top: 14px;">
        <button type="submit">Resend verification email</button>
      </form>
      <div class="small">
        Didn't get it? Check spam. If using a real email, the link arrives in &lt; 1 minute.
        Wrong address? <a href="/signout">Sign out</a> and create a new account.
      </div>
    </div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const e = params.get('error'), m = params.get('message');
      if (e || m) {
        const div = document.createElement('div');
        div.className = 'msg ' + (e ? 'error' : 'success');
        div.textContent = e || m;
        document.querySelector('.subtitle').after(div);
      }
    })();
  </script>
</body>
</html>
