<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <title>My VINs · Locksmith Daddy</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root { --bg: #0f1419; --panel: #1a2027; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --accent: #ff6b35; --green: #2ea043; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; line-height: 1.5; }
    .wrap { max-width: 880px; margin: 30px auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    h1 { font-size: 24px; margin: 0; }
    .user { color: var(--muted); font-size: 13px; }
    .signout { color: var(--muted); font-size: 13px; text-decoration: none; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; }
    .signout:hover { color: var(--accent); border-color: var(--accent); }
    .stat-row { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .stat .value { font-size: 22px; font-weight: 700; }
    .stat .value.accent { color: var(--accent); }
    .stat .value.green { color: var(--green); }
    .new-cta { background: var(--accent); color: #fff; padding: 11px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 18px; }
    h2 { font-size: 16px; margin: 0 0 14px; }
    .lookup-row { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .lookup-row:last-child { margin-bottom: 0; }
    .lookup-row .vehicle { font-weight: 600; font-size: 15px; }
    .lookup-row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .lookup-row .pn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; color: var(--green); font-weight: 700; margin-top: 4px; }
    .lookup-row .actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .lookup-row .view-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 7px 12px; border-radius: 5px; text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .lookup-row .view-btn:hover { background: var(--accent); color: #fff; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
    .empty a { color: var(--accent); }
    .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
    .footer a { color: var(--muted); margin: 0 6px; }
    @media (max-width: 600px) {
      .lookup-row { grid-template-columns: 1fr; }
      .lookup-row .actions { align-items: flex-start; flex-direction: row; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>My VINs</h1>
      <div>
        <span class="user">{{ user_email }}</span>&nbsp;
        <a class="signout" href="/signout" onclick="event.preventDefault();document.getElementById('signout-form').submit();">Sign out</a>
        <form id="signout-form" method="post" action="/signout" style="display:none;"></form>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="label">Paid VINs</div>
        <div class="value accent">{{ paid_count }}</div>
      </div>
      <div class="stat">
        <div class="label">Spent</div>
        <div class="value">${{ total_spent }}</div>
      </div>
      <div class="stat">
        <div class="label">Credits available</div>
        <div class="value green">{{ credit_balance }}</div>
      </div>
      <div class="stat" style="display:flex; align-items:center; justify-content:center;">
        <a class="new-cta" href="/">+ New VIN lookup</a>
      </div>
    </div>

    <div class="panel">
      <h2>Recent paid lookups</h2>
      {{ lookups_html }}
    </div>

    <div class="footer">
      LocksmithDaddy is a Cetabo LLC venture<br>
      <a href="/privacy">Privacy</a>·<a href="/refund-policy">Refund</a>·<a href="/enterprise">Enterprise</a>·<a href="mailto:contact@locksmithdaddy.us">Contact</a>
    </div>
  </div>
</body>
</html>
